<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forno Infinito</title>
<style>
  :root {
    --tile: #1d5c58;
    --tile-line: rgba(255, 255, 255, 0.07);
    --panel: #f2f7f5;
    --ink: #17332f;
    --muted: #5a7772;
    --line: #d5e2de;
    --berry: #e8536f;
    --dough: #d9a15b;
    --choc: #4a2a1a;
    --font: "Avenir Next Rounded", ui-rounded, "Nunito", "Trebuchet MS", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; }

  body {
    font-family: var(--font);
    color: var(--ink);
    background-color: var(--tile);
    background-image:
      linear-gradient(var(--tile-line) 2px, transparent 2px),
      linear-gradient(90deg, var(--tile-line) 2px, transparent 2px);
    background-size: 56px 56px;
    -webkit-tap-highlight-color: transparent;
  }

  .app {
    display: grid;
    grid-template-columns: 1fr;
    min-height: 100vh;
    min-height: 100dvh;
  }

  /* ---------- Bancada ---------- */
  .bakery {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 16px 24px;
    color: #fff;
    text-align: center;
  }

  .count {
    font-size: clamp(2.6rem, 11vw, 4.4rem);
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.02em;
    text-shadow: 0 3px 0 rgba(0, 0, 0, 0.25);
    font-variant-numeric: tabular-nums;
  }

  .unit { font-size: 1.1rem; font-weight: 700; margin-top: 4px; opacity: 0.9; }

  .rate {
    margin-top: 6px;
    font-size: 0.95rem;
    font-weight: 600;
    color: #bfe6dc;
    min-height: 1.4em;
  }

  .rate.frenzy { color: #ffe27a; }

  .stage {
    position: relative;
    margin: 20px 0 12px;
    width: 100%;
    display: grid;
    place-items: center;
  }

  .tray {
    width: min(84vw, 360px);
    aspect-ratio: 1;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: radial-gradient(circle at 35% 28%, #f1f5f5, #a9b9b8);
    box-shadow:
      inset 0 0 0 7px #cfdada,
      inset 0 0 0 9px rgba(0, 0, 0, 0.08),
      0 20px 30px rgba(0, 0, 0, 0.28);
  }

  .cookie {
    width: 76%;
    aspect-ratio: 1;
    padding: 0;
    border: 0;
    background: none;
    cursor: pointer;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
    filter: drop-shadow(0 8px 5px rgba(0, 0, 0, 0.3));
    transition: transform 0.09s ease-out;
  }

  .cookie svg { width: 100%; height: 100%; display: block; pointer-events: none; }
  .cookie:hover { transform: scale(1.025); }
  .cookie:active { transform: scale(0.93); }
  .cookie:focus-visible { outline: 4px solid #ffe27a; outline-offset: 6px; border-radius: 50%; }

  .floater {
    position: absolute;
    pointer-events: none;
    font-weight: 800;
    font-size: 1.5rem;
    color: #fff;
    text-shadow: 0 2px 0 var(--choc), 0 0 8px rgba(0, 0, 0, 0.4);
    transform: translate(-50%, -50%);
    animation: rise 0.9s ease-out forwards;
    z-index: 3;
  }

  @keyframes rise {
    to { transform: translate(-50%, -150px); opacity: 0; }
  }

  .stats {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    justify-content: center;
    font-size: 0.85rem;
    color: #bfe6dc;
    margin: 0;
  }

  /* ---------- Cozinha (loja) ---------- */
  .shop {
    background: var(--panel);
    border-radius: 22px 22px 0 0;
    padding: 20px 16px calc(24px + env(safe-area-inset-bottom));
    box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.18);
  }

  .shop h2 {
    margin: 0 0 4px;
    font-size: 1.25rem;
    font-weight: 800;
  }

  .shop .hint { margin: 0 0 12px; font-size: 0.9rem; color: var(--muted); }

  .shop ul { list-style: none; margin: 0; padding: 0; }
  .shop li + li { border-top: 1px solid var(--line); }

  .item {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 4px;
    border: 0;
    background: none;
    font: inherit;
    color: inherit;
    text-align: left;
    cursor: pointer;
    touch-action: manipulation;
    transition: opacity 0.15s;
  }

  .item.poor { opacity: 0.5; }
  .item:not(.poor):hover { background: rgba(232, 83, 111, 0.07); }
  .item:not(.poor):active { background: rgba(232, 83, 111, 0.14); }
  .item:focus-visible { outline: 3px solid var(--berry); outline-offset: 2px; border-radius: 8px; }

  .info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .name { font-weight: 800; font-size: 1.05rem; }
  .desc { font-size: 0.85rem; color: var(--muted); }

  .cost {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-weight: 800;
    font-size: 0.95rem;
    color: var(--berry);
    font-variant-numeric: tabular-nums;
  }

  .cost i {
    width: 13px; height: 13px; border-radius: 50%;
    background: var(--dough);
    box-shadow: inset 0 0 0 2px #b8783a;
    display: inline-block;
  }

  .owned {
    flex: none;
    min-width: 2.4ch;
    font-size: 1.9rem;
    font-weight: 800;
    color: var(--tile);
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  .reset {
    margin-top: 18px;
    padding: 8px 0;
    border: 0;
    background: none;
    font: inherit;
    font-size: 0.85rem;
    color: var(--muted);
    text-decoration: underline;
    cursor: pointer;
  }

  /* ---------- Cookie dourado ---------- */
  .golden {
    position: fixed;
    width: 76px;
    height: 76px;
    border: 0;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    cursor: pointer;
    z-index: 10;
    background:
      radial-gradient(circle at 62% 62%, #7a5210 0 5px, transparent 6px),
      radial-gradient(circle at 36% 40%, #7a5210 0 4px, transparent 5px),
      radial-gradient(circle at 60% 30%, #7a5210 0 3px, transparent 4px),
      radial-gradient(circle at 35% 30%, #fff3b0, #f2c230 55%, #c98d10);
    box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.55), 0 0 34px 6px rgba(255, 215, 94, 0.9);
    animation: wobble 1.1s ease-in-out infinite alternate;
  }

  .golden:focus-visible { outline: 4px solid #fff; outline-offset: 4px; }

  @keyframes wobble {
    from { transform: translate(-50%, -50%) rotate(-8deg) scale(0.96); }
    to   { transform: translate(-50%, -50%) rotate(8deg) scale(1.06); }
  }

  /* ---------- Aviso ---------- */
  .toast {
    position: fixed;
    left: 50%;
    top: 16px;
    transform: translate(-50%, -140%);
    max-width: calc(100vw - 32px);
    padding: 12px 18px;
    border-radius: 14px;
    background: var(--choc);
    color: #fff;
    font-weight: 700;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    transition: transform 0.25s ease-out;
    z-index: 20;
    text-align: center;
  }

  .toast.show { transform: translate(-50%, 0); }

  /* ---------- Telas grandes ---------- */
  @media (min-width: 860px) {
    .app { grid-template-columns: 1fr 400px; height: 100vh; }
    .bakery { justify-content: center; padding-bottom: 48px; }
    .shop {
      border-radius: 0;
      overflow-y: auto;
      padding: 28px 24px;
      box-shadow: -8px 0 24px rgba(0, 0, 0, 0.18);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .cookie { transition: none; }
    .golden { animation: none; }
    .toast { transition: none; }
    @keyframes rise { to { opacity: 0; } }
  }
</style>
</head>
<body>

<div class="app">
  <section class="bakery" id="bakery">
    <div class="count" id="count">0</div>
    <div class="unit">cookies</div>
    <div class="rate" id="rate">0 por segundo</div>

    <div class="stage" id="stage">
      <div class="tray">
        <button class="cookie" id="cookie" aria-label="Assar um cookie">
          <svg viewBox="0 0 200 200" aria-hidden="true">
            <defs>
              <radialGradient id="dough" cx="38%" cy="32%" r="75%">
                <stop offset="0" stop-color="#eebd7a"/>
                <stop offset="0.7" stop-color="#d09048"/>
                <stop offset="1" stop-color="#b57334"/>
              </radialGradient>
            </defs>
            <circle cx="100" cy="100" r="92" fill="url(#dough)" stroke="#8a5426" stroke-width="4"/>
            <circle cx="100" cy="100" r="80" fill="none" stroke="#e9b878" stroke-width="2" stroke-dasharray="3 9" opacity="0.7"/>
            <g fill="#4a2a1a">
              <ellipse cx="62" cy="58" rx="13" ry="10" transform="rotate(-20 62 58)"/>
              <ellipse cx="128" cy="50" rx="11" ry="9" transform="rotate(25 128 50)"/>
              <ellipse cx="150" cy="100" rx="13" ry="10" transform="rotate(-10 150 100)"/>
              <ellipse cx="98" cy="96" rx="14" ry="11" transform="rotate(15 98 96)"/>
              <ellipse cx="52" cy="112" rx="11" ry="9" transform="rotate(35 52 112)"/>
              <ellipse cx="86" cy="146" rx="13" ry="10" transform="rotate(-25 86 146)"/>
              <ellipse cx="136" cy="144" rx="11" ry="9" transform="rotate(10 136 144)"/>
              <ellipse cx="108" cy="36" rx="7" ry="6"/>
              <ellipse cx="34" cy="80" rx="6" ry="5"/>
              <ellipse cx="166" cy="66" rx="6" ry="5"/>
            </g>
            <g fill="#8a5a3a" opacity="0.8">
              <ellipse cx="59" cy="54" rx="4" ry="3"/>
              <ellipse cx="95" cy="92" rx="4" ry="3"/>
              <ellipse cx="147" cy="96" rx="4" ry="3"/>
              <ellipse cx="83" cy="142" rx="4" ry="3"/>
            </g>
          </svg>
        </button>
      </div>
    </div>

    <p class="stats">
      <span>Cliques: <b id="clicks">0</b></span>
      <span>Total assado: <b id="total">0</b></span>
    </p>
  </section>

  <section class="shop" aria-labelledby="shop-title">
    <h2 id="shop-title">Cozinha</h2>
    <p class="hint">Toque em um item para comprar. Fique de olho no cookie dourado!</p>
    <ul id="list"></ul>
    <button class="reset" id="reset">Recomeçar do zero</button>
  </section>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
  // ---------- Dados do jogo ----------
  const BUILDINGS = [
    { id: 'cursor',  name: 'Cursor',            desc: 'Clica sozinho por você',      base: 15,      cps: 0.1 },
    { id: 'gran',    name: 'Vovó',              desc: 'Assa com receita de família', base: 100,     cps: 1 },
    { id: 'farm',    name: 'Fazenda de trigo',  desc: 'Farinha direto da fonte',     base: 1100,    cps: 8 },
    { id: 'mine',    name: 'Mina de chocolate', desc: 'Gotas escavadas fresquinhas', base: 12000,   cps: 47 },
    { id: 'factory', name: 'Fábrica',           desc: 'Linha de produção 24 horas',  base: 130000,  cps: 260 },
    { id: 'lab',     name: 'Laboratório',       desc: 'Cookies feitos com ciência',  base: 1400000, cps: 1400 },
  ];
  const byId = Object.fromEntries(BUILDINGS.map(b => [b.id, b]));
  const SAVE_KEY = 'forno-infinito';

  const state = { cookies: 0, total: 0, clicks: 0, clickLevel: 0, owned: {}, boostUntil: 0 };

  const clickPower = () => Math.pow(2, state.clickLevel);
  const clickCost  = () => Math.ceil(100 * Math.pow(4, state.clickLevel));
  const cost       = b => Math.ceil(b.base * Math.pow(1.15, state.owned[b.id] || 0));
  const baseCps    = () => BUILDINGS.reduce((s, b) => s + (state.owned[b.id] || 0) * b.cps, 0);
  const boost      = () => (Date.now() < state.boostUntil ? 7 : 1);
  const cps        = () => baseCps() * boost();

  // ---------- Formatação ----------
  function fmt(n) {
    if (n < 1000) return Math.floor(n).toLocaleString('pt-BR');
    const units = ['mil', 'mi', 'bi', 'tri', 'quad'];
    let i = -1;
    while (n >= 1000 && i < units.length - 1) { n /= 1000; i++; }
    const digits = n < 10 ? 2 : n < 100 ? 1 : 0;
    return n.toFixed(digits).replace('.', ',') + ' ' + units[i];
  }
  const fmtRate = n => (n < 10 ? n.toFixed(1).replace('.', ',') : fmt(n));

  // ---------- Elementos ----------
  const $ = id => document.getElementById(id);
  const countEl = $('count'), rateEl = $('rate'), stage = $('stage'), cookieBtn = $('cookie');
  const clicksEl = $('clicks'), totalEl = $('total'), listEl = $('list'), toastEl = $('toast');

  // ---------- Loja ----------
  const rows = [];

  function addRow(id, name) {
    const li = document.createElement('li');
    li.innerHTML =
      '<button class="item" type="button">' +
        '<span class="info">' +
          '<span class="name"></span>' +
          '<span class="desc"></span>' +
          '<span class="cost"><i></i><span class="price"></span></span>' +
        '</span>' +
        '<span class="owned">0</span>' +
      '</button>';
    const btn = li.querySelector('.item');
    li.querySelector('.name').textContent = name;
    btn.addEventListener('click', () => buy(id));
    listEl.appendChild(li);
    rows.push({
      id, btn,
      desc: li.querySelector('.desc'),
      price: li.querySelector('.price'),
      owned: li.querySelector('.owned'),
    });
  }

  function buildShop() {
    addRow('click', 'Mãos de manteiga');
    BUILDINGS.forEach(b => addRow(b.id, b.name));
  }

  function buy(id) {
    if (id === 'click') {
      const c = clickCost();
      if (state.cookies < c) return;
      state.cookies -= c;
      state.clickLevel++;
    } else {
      const b = byId[id], c = cost(b);
      if (state.cookies < c) return;
      state.cookies -= c;
      state.owned[id] = (state.owned[id] || 0) + 1;
    }
    render();
  }

  // ---------- Desenho da tela ----------
  function render() {
    countEl.textContent = fmt(state.cookies);
    document.title = fmt(state.cookies) + ' cookies';
    const mult = boost();
    rateEl.textContent = fmtRate(cps()) + ' por segundo' + (mult > 1 ? ' (frenesi ×7)' : '');
    rateEl.classList.toggle('frenzy', mult > 1);
    clicksEl.textContent = fmt(state.clicks);
    totalEl.textContent = fmt(state.total);

    rows.forEach(r => {
      let c;
      if (r.id === 'click') {
        c = clickCost();
        r.owned.textContent = state.clickLevel;
        r.desc.textContent = 'Cada clique vale ' + fmt(clickPower()) + ', passa a valer ' + fmt(clickPower() * 2);
      } else {
        const b = byId[r.id];
        c = cost(b);
        r.owned.textContent = state.owned[r.id] || 0;
        r.desc.textContent = b.desc + ' (+' + fmtRate(b.cps) + '/s cada)';
      }
      r.price.textContent = fmt(c);
      r.btn.classList.toggle('poor', state.cookies < c);
    });
  }

  // ---------- Clique no cookie ----------
  function bake(x, y) {
    const p = clickPower();
    state.cookies += p;
    state.total += p;
    state.clicks++;
    floater(x, y, '+' + fmt(p));
    render();
  }

  function floater(x, y, text) {
    const el = document.createElement('span');
    el.className = 'floater';
    el.textContent = text;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.addEventListener('animationend', () => el.remove());
    stage.appendChild(el);
  }

  cookieBtn.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    const r = stage.getBoundingClientRect();
    bake(e.clientX - r.left, e.clientY - r.top);
  });

  // Teclado (Enter ou Espaço): o "click" sem ponteiro tem detail === 0
  cookieBtn.addEventListener('click', e => {
    if (e.detail !== 0) return;
    const r = stage.getBoundingClientRect();
    const c = cookieBtn.getBoundingClientRect();
    bake(c.left - r.left + c.width / 2, c.top - r.top + c.height / 2);
  });

  // ---------- Produção automática ----------
  let last = Date.now();
  function tick() {
    const now = Date.now();
    const dt = Math.min((now - last) / 1000, 3600);
    last = now;
    const gain = cps() * dt;
    state.cookies += gain;
    state.total += gain;
    render();
  }

  // ---------- Cookie dourado ----------
  let toastTimer;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 3500);
  }

  function scheduleGolden() {
    setTimeout(spawnGolden, 40000 + Math.random() * 50000);
  }

  function spawnGolden() {
    const g = document.createElement('button');
    g.className = 'golden';
    g.type = 'button';
    g.setAttribute('aria-label', 'Cookie dourado! Toque para ganhar um bônus');
    g.style.left = (12 + Math.random() * 76) + '%';
    g.style.top = (16 + Math.random() * 66) + '%';

    const expire = setTimeout(() => { g.remove(); scheduleGolden(); }, 13000);

    g.addEventListener('click', () => {
      clearTimeout(expire);
      g.remove();
      if (Math.random() < 0.5) {
        state.boostUntil = Date.now() + 20000;
        toast('Frenesi! Produção ×7 por 20 segundos');
      } else {
        const bonus = Math.min(state.cookies * 0.15, cps() * 900) + 13;
        state.cookies += bonus;
        state.total += bonus;
        toast('Sorte! Você ganhou ' + fmt(bonus) + ' cookies');
      }
      render();
      scheduleGolden();
    });

    document.body.appendChild(g);
  }

  // ---------- Salvar e carregar ----------
  async function load() {
    try {
      const r = await window.storage.get(SAVE_KEY);
      if (r && r.value) {
        const d = JSON.parse(r.value);
        state.cookies = d.cookies || 0;
        state.total = d.total || 0;
        state.clicks = d.clicks || 0;
        state.clickLevel = d.clickLevel || 0;
        state.owned = d.owned || {};
      }
    } catch (err) { /* sem progresso salvo */ }
  }

  async function save() {
    try {
      await window.storage.set(SAVE_KEY, JSON.stringify({
        cookies: state.cookies, total: state.total, clicks: state.clicks,
        clickLevel: state.clickLevel, owned: state.owned,
      }));
    } catch (err) { /* armazenamento indisponível */ }
  }

  // Recomeçar: pede um segundo toque para confirmar
  const resetBtn = $('reset');
  let resetArmed = false, resetTimer;
  resetBtn.addEventListener('click', () => {
    if (!resetArmed) {
      resetArmed = true;
      resetBtn.textContent = 'Toque de novo para apagar tudo';
      resetTimer = setTimeout(() => {
        resetArmed = false;
        resetBtn.textContent = 'Recomeçar do zero';
      }, 3000);
      return;
    }
    clearTimeout(resetTimer);
    resetArmed = false;
    resetBtn.textContent = 'Recomeçar do zero';
    Object.assign(state, { cookies: 0, total: 0, clicks: 0, clickLevel: 0, owned: {}, boostUntil: 0 });
    save();
    render();
  });

  // ---------- Início ----------
  buildShop();
  render();
  load().then(() => {
    last = Date.now();
    render();
    setInterval(tick, 100);
    setInterval(save, 5000);
    scheduleGolden();
  });
</script>
</body>
</html>
